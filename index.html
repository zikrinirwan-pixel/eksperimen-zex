<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntreKilat - Sistem Booking & Antrean WA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white font-bold">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>
                <div>
                    <h1 id="brandName" class="font-extrabold text-sm leading-tight">PREMIUM LAUNDRY & CARE</h1>
                    <p class="text-[10px] text-indigo-400">Sistem Antrean & Booking Online</p>
                </div>
            </div>
            <button onclick="toggleModal()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1 text-slate-200">
                <i class="fa-solid fa-gear text-indigo-400"></i> Set Toko
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

        <!-- STATUS BUKA / TUTUP BANNER -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex justify-between items-center">
            <div>
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Status Operasional</p>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="statusIndicator" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="statusText" class="font-extrabold text-sm text-slate-900">Buka (Menerima Pesanan)</span>
                </div>
            </div>
            <button onclick="toggleStatus()" class="text-xs bg-slate-100 hover:bg-slate-200 font-bold px-3 py-2 rounded-xl text-slate-700 transition">
                Ubah Status
            </button>
        </div>

        <!-- FORM BOOKING PELANGGAN -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
            <h2 class="font-bold text-xs uppercase tracking-wider text-slate-400">Formulir Booking / Antrean</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] font-semibold text-slate-600">Nama Pemesan</label>
                    <input id="clientName" type="text" placeholder="Masukkan nama lengkap" class="w-full mt-1 px-3 py-2.5 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] font-semibold text-slate-600">No. WhatsApp</label>
                        <input id="clientPhone" type="tel" placeholder="0812xxxx" class="w-full mt-1 px-3 py-2.5 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="text-[11px] font-semibold text-slate-600">Pilih Layanan</label>
                        <select id="serviceType" class="w-full mt-1 px-3 py-2.5 text-xs border border-slate-200 rounded-xl bg-white focus:outline-none focus:border-indigo-500">
                            <option value="Cuci Komplit Reguler">Cuci Komplit Reguler</option>
                            <option value="Cuci Kilat 6 Jam">Cuci Kilat 6 Jam</option>
                            <option value="Cuci Sepatu / Deep Cleaning">Cuci Sepatu (Deep Clean)</option>
                            <option value="Setrika Saja">Setrika Saja</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] font-semibold text-slate-600">Estimasi Waktu / Jam</label>
                        <select id="timeSlot" class="w-full mt-1 px-3 py-2.5 text-xs border border-slate-200 rounded-xl bg-white focus:outline-none focus:border-indigo-500">
                            <option value="Pagi (09:00 - 11:00)">Pagi (09:00 - 11:00)</option>
                            <option value="Siang (13:00 - 15:00)">Siang (13:00 - 15:00)</option>
                            <option value="Sore (16:00 - 18:00)">Sore (16:00 - 18:00)</option>
                            <option value="Malam (19:00 - 21:00)">Malam (19:00 - 21:00)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] font-semibold text-slate-600">Metode Penyerahan</label>
                        <select id="deliveryMethod" class="w-full mt-1 px-3 py-2.5 text-xs border border-slate-200 rounded-xl bg-white focus:outline-none focus:border-indigo-500">
                            <option value="Antar ke Outlet (Drop-off)">Antar ke Outlet</option>
                            <option value="Jemput ke Rumah (Pick-up)">Jemput ke Rumah</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-semibold text-slate-600">Catatan Tambahan (Opsional)</label>
                    <input id="clientNote" type="text" placeholder="Misal: Pakaian putih dipisah, deterjen khusus" class="w-full mt-1 px-3 py-2.5 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                </div>

                <button onclick="sendBooking()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm py-3.5 rounded-xl shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2 mt-2">
                    <i class="fa-brands fa-whatsapp text-lg text-emerald-400"></i>
                    <span>Kirim Booking ke WhatsApp Toko</span>
                </button>
            </div>
        </div>

        <!-- DAFTAR ANTREAN HARI INI -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-xs uppercase tracking-wider text-slate-400">Daftar Antrean Masuk (<span id="queueCount">0</span>)</h2>
                <button onclick="clearQueue()" class="text-[11px] text-red-500 font-semibold hover:underline">Reset Antrean</button>
            </div>

            <div id="queueList" class="divide-y divide-slate-100 text-xs py-1">
                <p class="text-slate-400 text-center py-4 italic">Belum ada antrean tercatat</p>
            </div>
        </div>

    </main>

    <!-- MODAL PENGATURAN -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
            <h3 class="font-extrabold text-base text-slate-900">Pengaturan Toko & Nomor WA</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-slate-600">Nama Usaha</label>
                    <input id="setBrandName" type="text" class="w-full mt-1 px-3 py-2 text-xs border border-slate-300 rounded-xl">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">Nomor WhatsApp Tujuan (Pemilik Toko)</label>
                    <input id="setOwnerPhone" type="text" placeholder="628xxxxxxxxxx" class="w-full mt-1 px-3 py-2 text-xs border border-slate-300 rounded-xl">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="toggleModal()" class="w-1/2 bg-slate-100 text-slate-700 font-bold text-xs py-2.5 rounded-xl">Batal</button>
                <button onclick="saveSettings()" class="w-1/2 bg-indigo-600 text-white font-bold text-xs py-2.5 rounded-xl">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        let brandName = localStorage.getItem('bk_brand_name') || 'CLEAN & FRESH LAUNDRY';
        let ownerPhone = localStorage.getItem('bk_owner_phone') || '6283147684295';
        let isOpen = localStorage.getItem('bk_is_open') !== 'false';
        let queue = JSON.parse(localStorage.getItem('bk_queue')) || [];

        function initApp() {
            document.getElementById('brandName').innerText = brandName;
            document.getElementById('setBrandName').value = brandName;
            document.getElementById('setOwnerPhone').value = ownerPhone;
            updateStatusUI();
            renderQueue();
        }

        function updateStatusUI() {
            const ind = document.getElementById('statusIndicator');
            const txt = document.getElementById('statusText');
            if (isOpen) {
                ind.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                txt.innerText = "Buka (Menerima Pesanan)";
            } else {
                ind.className = "w-3 h-3 rounded-full bg-red-500";
                txt.innerText = "Tutup (Istirahat / Penuh)";
            }
        }

        function toggleStatus() {
            isOpen = !isOpen;
            localStorage.setItem('bk_is_open', isOpen);
            updateStatusUI();
        }

        function sendBooking() {
            if (!isOpen) {
                alert('Maaf, saat ini status toko sedang TUTUP atau antrean penuh.');
                return;
            }

            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const service = document.getElementById('serviceType').value;
            const time = document.getElementById('timeSlot').value;
            const delivery = document.getElementById('deliveryMethod').value;
            const note = document.getElementById('clientNote').value.trim() || '-';

            if (!name || !phone) {
                alert('Mohon isi Nama dan Nomor WhatsApp Anda terlebih dahulu.');
                return;
            }

            const bookingData = { name, phone, service, time, delivery, note, timeRecorded: new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}) };
            queue.push(bookingData);
            localStorage.setItem('bk_queue', JSON.stringify(queue));
            renderQueue();

            // Format Pesan ke WA Pemilik Toko
            let message = `*HALO ADMIN, SAYA MAU BOOKING!*\n\n`;
            message += `• Nama : *${name}*\n`;
            message += `• No. WA : ${phone}\n`;
            message += `• Layanan : *${service}*n`;
            message += `• Jam : ${time}\n`;
            message += `• Metode : ${delivery}\n`;
            message += `• Catatan : ${note}\n\n`;
            message += `Mohon konfirmasi ketersediaannya ya Kak. Terima kasih!`;

            const encodedMessage = encodeURIComponent(message);
            const waUrl = `https://wa.me/${ownerPhone}?text=${encodedMessage}`;
            window.open(waUrl, '_blank');

            // Reset form input
            document.getElementById('clientName').value = '';
            document.getElementById('clientPhone').value = '';
            document.getElementById('clientNote').value = '';
        }

        function renderQueue() {
            const list = document.getElementById('queueList');
            document.getElementById('queueCount').innerText = queue.length;

            if (queue.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-center py-4 italic">Belum ada antrean tercatat</p>';
                return;
            }

            let html = '';
            queue.forEach((item, index) => {
                html += `
                <div class="py-2.5 flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="bg-indigo-100 text-indigo-700 font-extrabold px-2 py-0.5 rounded text-[10px]">#${index + 1}</span>
                            <span class="font-bold text-slate-900">${item.name}</span>
                        </div>
                        <p class="text-[11px] text-slate-500 mt-0.5">${item.service} • <span class="text-indigo-600 font-semibold">${item.time}</span></p>
                    </div>
                    <button onclick="removeQueue(${index})" class="text-slate-400 hover:text-red-500 text-xs px-2 py-1"><i class="fa-solid fa-check"></i> Selesai</button>
                </div>`;
            });
            list.innerHTML = html;
        }

        function removeQueue(index) {
            queue.splice(index, 1);
            localStorage.setItem('bk_queue', JSON.stringify(queue));
            renderQueue();
        }

        function clearQueue() {
            if (confirm('Kosongkan semua daftar antrean?')) {
                queue = [];
                localStorage.setItem('bk_queue', JSON.stringify(queue));
                renderQueue();
            }
        }

        function toggleModal() {
            document.getElementById('settingsModal').classList.toggle('hidden');
        }

        function saveSettings() {
            const newBrand = document.getElementById('setBrandName').value.trim();
            const newPhone = document.getElementById('setOwnerPhone').value.trim();
            if (newBrand) {
                brandName = newBrand;
                localStorage.setItem('bk_brand_name', brandName);
                document.getElementById('brandName').innerText = brandName;
            }
            if (newPhone) {
                ownerPhone = newPhone.replace(/[^0-9]/g, '');
                localStorage.setItem('bk_owner_phone', ownerPhone);
            }
            toggleModal();
        }

        initApp();
    </script>
</body>
</html>
